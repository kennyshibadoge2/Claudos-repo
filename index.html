<style>
/*
VOICE: cosy, playful, a handheld pet toy you carry around in your pocket.
IDEA: a lacquered toy case — the 3D world is the screen, the UI is soft cream plastic buttons.
PICTURE: the living room / town / field filling the screen, shibas front and centre.
COLOUR and TYPE: persimmon orange + rice cream + roasted-tea brown, sky blue for actions; Fredoka rounded.
LAYOUT: full-bleed 3D; top status strip, bottom dock of chunky buttons, sheets slide up from the bottom.
*/
:root{
  color-scheme:light;
  --cream:#fff7ea;--cream2:#fbe9cf;--ink:#3b2a1f;--ink2:#7a5c46;
  --orange:#ee8a3c;--orange-d:#c8622a;--sky:#4aa6e0;--sky-d:#2f7fb6;
  --pink:#f39bb0;--leaf:#79b25a;--gold:#f2c24b;--red:#e2574c;
  --shadow:0 6px 0 rgba(90,55,30,.18),0 10px 24px rgba(60,35,20,.18);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f2a65a;color:var(--ink);
  font:16px/1.4 "Fredoka",ui-rounded,"Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.topbar{position:absolute;top:calc(8px + var(--safe-t));left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));
  display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.topbar>*{pointer-events:auto}
#pets{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{display:flex;align-items:center;gap:6px;background:var(--cream);border-radius:999px;padding:4px 12px 4px 4px;
  box-shadow:var(--shadow);font-weight:600;font-size:15px;min-height:40px;transition:transform .15s}
.chip .dot{width:32px;height:32px;border-radius:50%;flex:none;border:3px solid #fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.chip.on{background:#fff;outline:3px solid var(--orange)}
.chip .mood{font-size:12px;color:var(--ink2);font-weight:500;display:block;line-height:1}
.chip .nm{line-height:1.05}
.stat{display:flex;align-items:center;gap:6px;background:var(--cream);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);
  font-weight:700;min-height:40px;white-space:nowrap}
.stat svg{width:22px;height:22px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--cream);box-shadow:var(--shadow);display:grid;place-items:center}
.iconbtn svg{width:24px;height:24px}
.iconbtn.listening{background:#e2574c;color:#fff}
#micRing{position:absolute;inset:-4px;border-radius:50%;border:3px solid rgba(226,87,76,.55);pointer-events:none;transition:transform .06s}
.iconbtn:not(.listening) #micRing{display:none}
#btnMic{color:#3b2a1f}
#voiceHeard{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + var(--safe-b));background:#fff;color:#3b2a1f;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:opacity .3s;pointer-events:none;white-space:nowrap}
.iconbtn .badge{position:absolute;top:-4px;right:-4px;background:#e2574c;color:#fff;border-radius:999px;font-size:12px;font-weight:700;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px}
#needs{position:absolute;top:calc(60px + var(--safe-t));left:calc(8px + var(--safe-l));background:rgba(255,247,234,.92);
  border-radius:16px;padding:8px 10px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 84px;gap:3px 8px;
  font-size:13px;font-weight:600;align-items:center;transition:opacity .3s}
#needs .bar{height:9px;border-radius:9px;background:#ead7bb;overflow:hidden}
#needs .bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
#needs.min{opacity:.0;pointer-events:none}
.dock{position:absolute;left:0;right:0;bottom:calc(10px + var(--safe-b));display:flex;justify-content:center;gap:8px;
  padding:0 calc(8px + var(--safe-r)) 0 calc(8px + var(--safe-l));flex-wrap:wrap;pointer-events:none}
.dock button{pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:68px;height:68px;border-radius:22px;background:var(--cream);box-shadow:var(--shadow);font-size:13px;font-weight:600;
  transition:transform .12s}
.dock button:active{transform:translateY(3px) scale(.96)}
.dock button svg{width:30px;height:30px}
.dock button.go{background:var(--orange);color:#fff}
.dock button.blue{background:var(--sky);color:#fff}
#prompts{position:absolute;right:calc(12px + var(--safe-r));bottom:calc(96px + var(--safe-b));display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:70vw}
.pbtn{background:var(--sky);color:#fff;font-weight:700;border-radius:999px;padding:12px 20px;box-shadow:var(--shadow);min-height:48px;
  font-size:17px;animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
.pbtn.orange{background:var(--orange)}
.pbtn.pink{background:var(--pink)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + var(--safe-t));background:rgba(59,42,31,.82);color:#fff;
  padding:8px 16px;border-radius:999px;font-weight:500;font-size:15px;max-width:90vw;text-align:center;transition:opacity .4s;pointer-events:none}

/* ---------- Sheet ---------- */
#sheetWrap{position:fixed;inset:0;z-index:20;background:rgba(40,25,15,.25);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:min(720px,100%);max-height:min(76vh,640px);background:var(--cream);border-radius:28px 28px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);
  display:flex;flex-direction:column;padding-bottom:var(--safe-b);animation:up .28s cubic-bezier(.2,1.2,.5,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sh-head h2{margin:0;font-size:24px;flex:1;line-height:1.1}
.sh-close{width:44px;height:44px;border-radius:50%;background:var(--cream2);font-size:22px;font-weight:700}
.tabs{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto;flex:none}
.tab{padding:8px 14px;border-radius:999px;background:var(--cream2);font-weight:600;white-space:nowrap;min-height:40px}
.tab.on{background:var(--orange);color:#fff}
.sh-body{overflow-y:auto;padding:4px 14px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{background:#fff;border-radius:18px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;
  box-shadow:0 3px 0 rgba(90,55,30,.12);position:relative;min-height:44px}
.card img{width:72px;height:72px;object-fit:contain;pointer-events:none}
.card .nm{font-weight:600;font-size:14px;line-height:1.15}
.card .sub{font-size:13px;color:var(--ink2)}
.card .badge{position:absolute;top:6px;right:8px;background:var(--orange);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:1px 7px}
.card.on{outline:3px solid var(--orange)}
.card.dim{opacity:.45}
.card .buy{margin-top:4px;background:var(--sky);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;min-height:36px}
.card .buy[disabled]{background:#c9b8a3}
.row{display:flex;gap:10px;align-items:center}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:#fff;border-radius:16px;padding:10px 12px;display:flex;gap:12px;align-items:center;min-height:56px;box-shadow:0 3px 0 rgba(90,55,30,.12);text-align:left;width:100%}
.li .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--cream2)}
.li .ic svg{width:28px;height:28px}
.li .tx{flex:1}
.li .tx b{display:block;font-size:16px}
.li .tx span{font-size:13px;color:var(--ink2)}
.li.lock{opacity:.5}
.prog{height:8px;background:#ead7bb;border-radius:8px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--orange);border-radius:8px}
.btn{background:var(--sky);color:#fff;font-weight:700;border-radius:999px;padding:12px 20px;min-height:48px;box-shadow:0 4px 0 var(--sky-d)}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-d)}
.btn.ghost{background:var(--cream2);color:var(--ink);box-shadow:0 4px 0 #e2cba9}
.note{font-size:14px;color:var(--ink2);margin:6px 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.kv b{font-weight:600}
h3{margin:14px 0 6px;font-size:18px}

/* ---------- Dialogue ---------- */
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));width:min(680px,calc(100% - 16px));z-index:25;
  background:var(--cream);border-radius:24px;box-shadow:var(--shadow);padding:14px 16px 14px 14px;display:flex;gap:12px;min-height:120px;
  border:4px solid #fff;animation:pop .25s}
#dlgPort{width:84px;height:84px;border-radius:20px;background:var(--cream2);flex:none;object-fit:cover}
#dlgName{font-weight:700;color:var(--orange-d);font-size:17px}
#dlgText{font-size:18px;line-height:1.35;min-height:50px}
#dlgMore{position:absolute;right:16px;bottom:10px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid var(--orange);animation:bob .8s infinite}
@keyframes bob{50%{transform:translateY(4px)}}
#dlgChoices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#dlgChoices button{background:#fff;border-radius:14px;padding:10px 14px;text-align:left;font-weight:600;min-height:44px;box-shadow:0 3px 0 rgba(90,55,30,.12)}
#dlgChoices button:active{background:var(--cream2)}
@media (max-width:520px){#dlgPort{width:60px;height:60px}#dlgText{font-size:16px}}

/* ---------- Toasts / banner / cursor ---------- */
#toasts{position:fixed;top:calc(64px + var(--safe-t));right:calc(10px + var(--safe-r));z-index:30;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{background:#fff;border-radius:16px;padding:8px 14px;box-shadow:var(--shadow);font-weight:600;font-size:15px;animation:tin .3s cubic-bezier(.3,1.5,.6,1);max-width:70vw}
.toast.gold{background:var(--gold)}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
#banner{position:fixed;left:0;right:0;top:32%;text-align:center;z-index:28;pointer-events:none}
#banner b{display:inline-block;color:#fff;font-size:clamp(54px,15vw,110px);font-weight:700;letter-spacing:1px;line-height:1;
  -webkit-text-stroke:7px #e2762e;paint-order:stroke fill;text-shadow:0 6px 0 #b8541c,0 10px 24px rgba(59,42,31,.35);animation:bpop .5s cubic-bezier(.25,1.7,.5,1)}
@keyframes bpop{0%{transform:scale(.3) rotate(-8deg);opacity:0}60%{opacity:1}100%{transform:none}}
#bannerCard{position:fixed;left:50%;top:calc(66px + var(--safe-t));z-index:29;pointer-events:none;display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,#fffaf1,#fff1dc);border-radius:22px;padding:10px 20px 10px 10px;box-shadow:0 10px 30px rgba(59,42,31,.22),inset 0 -3px 0 rgba(226,118,46,.18);
  border:2px solid #fff;max-width:min(92vw,520px);transform:translate(-50%,-140%);opacity:0;transition:transform .45s cubic-bezier(.3,1.4,.6,1),opacity .3s}
#bannerCard.show{transform:translate(-50%,0);opacity:1}
#bannerCard i{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:24px;color:#fff;background:radial-gradient(circle at 35% 30%,#ffb067,#e2762e);box-shadow:0 3px 0 #b8541c}
#bannerCard b{display:block;font-size:19px;color:#3b2a1f;line-height:1.15}
#bannerCard small{display:block;font-size:14px;color:#8a6a4a;font-weight:500;margin-top:2px}
body.contest #bannerCard{top:calc(100px + var(--safe-t))}
#cursor{position:fixed;left:0;top:0;width:64px;height:64px;margin:-12px 0 0 -20px;z-index:40;pointer-events:none;transition:opacity .15s}
#cursor img{width:56px;height:56px;position:absolute;left:18px;top:-18px}
#fade{position:fixed;inset:0;background:#ffe9c9;z-index:50;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1;pointer-events:auto}

/* ---------- Title ---------- */
#title{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:18px;
  background:linear-gradient(180deg,rgba(242,166,90,.85) 0%,rgba(242,166,90,0) 34%,rgba(242,166,90,0) 70%,rgba(224,127,63,.85) 100%);text-align:center;
  padding:calc(28px + var(--safe-t)) 24px calc(28px + var(--safe-b))}
#title .bottom{display:flex;flex-direction:column;align-items:center;gap:10px}
#title h1{margin:0;font-size:clamp(54px,14vw,112px);line-height:.9;color:#fff;letter-spacing:-.02em;text-shadow:0 6px 0 #c8622a,0 14px 30px rgba(120,50,10,.35)}
#title h1 small{display:block;font-size:.3em;letter-spacing:0;color:#fff4e0;text-shadow:0 3px 0 #c8622a;margin-top:10px;font-weight:500}
#title .btn{font-size:22px;padding:14px 36px}
#title .ver{font-size:13px;color:#fff4e0;opacity:.85}
#loading{color:#fff;font-weight:600}

/* ---------- Modal ---------- */
#modalWrap{position:fixed;inset:0;z-index:35;background:rgba(40,25,15,.35);display:grid;place-items:center;padding:16px}
#modal{background:var(--cream);border-radius:26px;padding:20px;width:min(420px,100%);box-shadow:var(--shadow);border:4px solid #fff;animation:pop .25s}
#modal h2{margin:0 0 8px;font-size:24px}
#modal input[type=text]{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid #ead7bb;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
#modal input:focus{outline:none;border-color:var(--orange)}
.seg{display:flex;gap:8px;margin:12px 0}
.seg button{flex:1;padding:10px;border-radius:14px;background:var(--cream2);font-weight:600;min-height:46px}
.seg button.on{background:var(--orange);color:#fff}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* score card */
.score{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:8px 14px;font-weight:600;margin-bottom:6px}
.score.me{outline:3px solid var(--orange)}
#contestHud{position:absolute;top:calc(108px + var(--safe-t));left:50%;transform:translateX(-50%);background:var(--cream);border-radius:18px;padding:8px 16px;
  box-shadow:var(--shadow);font-weight:700;display:flex;gap:16px;white-space:nowrap}
#contestHud span{color:var(--orange-d)}
#board{position:absolute;top:calc(60px + var(--safe-t));left:calc(8px + var(--safe-l));background:rgba(29,42,36,.88);color:#fff;border-radius:16px;padding:8px 10px;min-width:150px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
#board div{display:flex;justify-content:space-between;gap:12px;padding:2px 4px;border-radius:8px}
#board div.me{background:#ee8a3c}
@media (max-width:600px){#board{top:calc(96px + var(--safe-t));font-size:12px;min-width:120px}}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,247,234,.35);border:3px solid rgba(255,255,255,.7);pointer-events:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,255,255,.85)}
@media (max-width:600px){
  .dock button{width:48px;height:56px;border-radius:15px;font-size:10.5px}
  .iconbtn{width:38px;height:38px}.iconbtn svg{width:21px;height:21px}
  .topbar{gap:5px}
  .dock button svg{width:25px;height:25px}
  .dock{gap:5px;flex-wrap:nowrap}
  #pets{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  #pets::-webkit-scrollbar{display:none}
  .chip{font-size:13px;padding-right:9px;min-height:36px;flex:none}
  .chip .dot{width:28px;height:28px}
  .stat{min-height:36px;padding:5px 10px;font-size:15px}
  #clock{display:none}
  #needs{top:calc(52px + var(--safe-t));left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));display:flex;gap:6px;padding:6px 8px;font-size:11px}
  #needs>span{display:none}
  #needs .bar{flex:1;height:16px;position:relative}
  #needs .bar::after{content:attr(data-l);position:absolute;left:6px;top:0;line-height:16px;font-size:10px;font-weight:700;color:#3b2a1f}
  #hint{top:calc(88px + var(--safe-t));font-size:14px}
  #contestHud{top:calc(126px + var(--safe-t));font-size:14px;gap:10px}
  #prompts{bottom:calc(80px + var(--safe-b))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tugbar{display:inline-block;width:130px;height:13px;background:#ead7bb;border-radius:8px;vertical-align:middle;overflow:hidden;margin:0 6px}.tugbar i{display:block;height:100%;border-radius:8px;transition:width .08s}
#listenBubble{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px) scale(.9);opacity:0;pointer-events:none;z-index:40;background:#fff;border:3px solid #f39bb0;border-radius:24px;padding:10px 18px 10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(59,42,31,.25);transition:all .25s;font:700 18px Fredoka,sans-serif;color:#3b2a1f}
#listenBubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
#listenBubble::before{content:'';width:22px;height:22px;border-radius:50%;background:#e2574c;box-shadow:0 0 0 0 rgba(226,87,76,.6);animation:lbPulse 1.2s infinite}
@keyframes lbPulse{0%{box-shadow:0 0 0 0 rgba(226,87,76,.55)}100%{box-shadow:0 0 0 14px rgba(226,87,76,0)}}
.lbBars{display:flex;gap:3px;align-items:center;height:26px}.lbBars i{display:block;width:5px;height:6px;border-radius:3px;background:#f39bb0;transition:height .06s}
#btnMic.muted{opacity:.55}
.qrow{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 0 #ead7bb}.qrow.done{opacity:.6}.qtxt{font-weight:700}.qbar{height:10px;background:#f1e3cc;border-radius:6px;overflow:hidden;margin:6px 0 2px}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#f39bb0,#ee8a3c)}.qrew{font-size:13px;color:#a0846a}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.album img{width:100%;border-radius:10px;border:4px solid #fff;box-shadow:0 2px 6px rgba(59,42,31,.25);cursor:pointer;transform:rotate(-1deg)}.album img:nth-child(2n){transform:rotate(1.2deg)}
.photoPrev{display:block;width:100%;max-height:52vh;object-fit:contain;border-radius:10px;border:5px solid #fff;box-shadow:0 3px 10px rgba(59,42,31,.3);margin:6px 0 10px}
.photoFlash{position:fixed;inset:0;background:#fff;z-index:90;pointer-events:none;animation:pflash .45s ease-out forwards}@keyframes pflash{from{opacity:.95}to{opacity:0}}
.prizeBox{background:linear-gradient(135deg,#fff6d6,#ffe9b0);border:3px solid #f2c24b;border-radius:18px;padding:12px;margin:10px 0;text-align:center}.prizeBox h3{margin:0 0 8px}.prizeItem{display:inline-flex;flex-direction:column;align-items:center;width:46%;vertical-align:top;margin:4px}.prizeItem img{width:72px;height:72px;border-radius:16px;background:#fff}.prizeItem small{color:#8a6a4a;font-size:12px}
.buy.prizeOnly{font-size:11px;line-height:1.15;background:#fff1c4;color:#8a6a1a}
#moreMenu{position:absolute;top:48px;right:0;background:#fff8ec;border-radius:20px;box-shadow:0 10px 30px rgba(59,42,31,.28);padding:8px;display:flex;flex-direction:column;gap:4px;min-width:190px;z-index:95;transform-origin:top right;animation:menuIn .16s ease-out}
#moreMenu.hidden{display:none}@keyframes menuIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
#moreMenu .iconbtn{width:100%;height:46px;border-radius:14px;box-shadow:none;background:transparent;display:flex;align-items:center;gap:12px;padding:0 12px;justify-content:flex-start;font-weight:600;font-size:16px;color:var(--ink)}
#moreMenu .iconbtn:active,#moreMenu .iconbtn:hover{background:#f6e6cc}
#moreMenu .iconbtn::after{content:attr(aria-label)}
#moreMenu .iconbtn .badge{position:static;margin-left:auto;order:2}
#btnMore .dotb{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:#e2574c;border:2px solid #fff}
@media (max-width:600px){.chip:not(.on){padding-right:4px}.chip:not(.on) .nm{display:none}}
.dogPick{background:#fff;border-radius:18px;padding:10px 12px;margin:0 0 12px;box-shadow:0 2px 0 #ead7bb}.dpTitle{font-weight:700;margin-bottom:6px}
.dpRow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.dpDog{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:96px;padding:8px 6px;border-radius:16px;background:#fbf1e1;border:3px solid transparent;font:inherit;color:inherit;cursor:pointer}
.dpDog img{width:56px;height:56px;border-radius:50%;background:#fbe9cf}.dpDog b{font-size:14px}.dpDog small{font-size:11px;color:#8a6a4a;text-align:center;line-height:1.15}.dpDog.on{border-color:var(--orange);background:#fff3e2}
/* during contests: keep the score/time pill, leaderboard, commentary and dialogue from overlapping */
body.contest #hint{top:auto;bottom:calc(16px + var(--safe-b));max-width:min(560px,92vw);font-size:15px;text-align:center;z-index:12}
body.contest #toasts{top:calc(118px + var(--safe-t))}
body.contest #contestHud{top:calc(60px + var(--safe-t))}
body.contest #board{top:calc(60px + var(--safe-t))}
body.contest #banner{top:38%}
body.contest.dlg #hint{display:none}
body.contest.dlg #contestHud{opacity:.35}
@media (max-width:700px){
  body.contest #contestHud{left:auto;right:calc(8px + var(--safe-r));transform:none;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 156px - var(--safe-l));padding:6px 12px;font-size:13px;gap:4px 10px;top:calc(56px + var(--safe-t))}
  body.contest #board{top:calc(56px + var(--safe-t));font-size:12px;min-width:124px;max-width:140px;padding:6px 8px}
  body.contest #toasts{top:calc(150px + var(--safe-t))}
  body.contest #hint{font-size:13px;padding:7px 12px}
}
